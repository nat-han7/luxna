<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurz nicht erreichbar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background: var(--bg-main); padding: var(--space-4);">
    <div style="max-width:420px; width:100%; padding:40px var(--space-4); text-align:center; background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); border: 1px solid var(--border-color);">
        <i class="fa-solid fa-heart-crack" style="font-size:2.5rem; color: var(--accent); margin-bottom: var(--space-3); display:block;"></i>
        <h2 style="margin-bottom: var(--space-2); color: var(--text-main);">Ganz kurz Geduld 💕</h2>
        <p style="color: var(--text-muted); line-height:1.6;">{{ message }}</p>
    </div>
</body>
</html>
